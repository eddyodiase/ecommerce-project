<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./pages/header.css" />
    <link rel="stylesheet" href="./pages/HomePage.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Load Roboto from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet" />

    <title>ecommerce-project</title>
  </head>
  <body>
    <header class="header">
      <div class="left-section">
        <a href="index.html" class="header-link">
          <img class="logo" src="./images/logo-white.png" alt="logo" />
          <img class="mobile-logo" src="/images/mobile-logo-white.png" alt="mobile logo" />
        </a>
      </div>
      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="Search" />
        <button class="search-button">
          <img class="search-icon" src="/images/icons/search-icon.png" alt="search" />
        </button>
      </div>
      <div class="right-section">
        <a class="orders-link header-link" href="/orders">
          <span class="orders-text">Orders</span>
        </a>
        <a class="cart-link header-link" href="/checkout" target="_blank" rel="noopener noreferrer">
          <img class="cart-icon" src="/images/icons/cart-icon.png" alt="cart" />
          <div class="cart-quantity">3</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </header>

    <main class="home-page">
      <div class="products-grid">
        <section class="product-container">
          <div class="product-image-container">
            <img class="product-image" src="./images/products/athletic-cotton-socks-6-pairs.jpg" alt="socks" />
          </div>
          <div class="product-name limit-text-to-2-lines">Black and Gray Athletic Cotton Socks - 6 Pairs</div>
          <div class="product-rating-container">
            <img class="product-rating-stars" src="/images/ratings/rating-45.png" alt="rating" />
            <div class="product-rating-count link-primary">87</div>
          </div>
          <div class="product-price">$10.90</div>
          <div class="product-quantity-container">
            <select>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="product-spacer"></div>
          <div class="added-to-cart"><img src="/images/icons/checkmark.png" alt="check" /> Added</div>
          <button class="add-to-cart-button button-primary">Add to Cart</button>
        </section>

        <section class="product-container">
          <div class="product-image-container">
            <img class="product-image" src="/images/products/intermediate-composite-basketball.jpg" alt="basketball" />
          </div>
          <div class="product-name limit-text-to-2-lines">Intermediate Size Basketball</div>
          <div class="product-rating-container">
            <img class="product-rating-stars" src="/images/ratings/rating-40.png" alt="rating" />
            <div class="product-rating-count link-primary">127</div>
          </div>
          <div class="product-price">$20.95</div>
          <div class="product-quantity-container">
            <select>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="product-spacer"></div>
          <div class="added-to-cart"><img src="/images/icons/checkmark.png" alt="check" /> Added</div>
          <button class="add-to-cart-button button-primary">Add to Cart</button>
        </section>

        <section class="product-container">
          <div class="product-image-container">
            <img class="product-image" src="/images/products/adults-plain-cotton-tshirt-2-pack-teal.jpg" alt="tshirt" />
          </div>
          <div class="product-name limit-text-to-2-lines">Adults Plain Cotton T-Shirt - 2 Pack</div>
          <div class="product-rating-container">
            <img class="product-rating-stars" src="/images/ratings/rating-45.png" alt="rating" />
            <div class="product-rating-count link-primary">56</div>
          </div>
          <div class="product-price">$7.99</div>
          <div class="product-quantity-container">
            <select>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="product-spacer"></div>
          <div class="added-to-cart"><img src="/images/icons/checkmark.png" alt="check" /> Added</div>
          <button class="add-to-cart-button button-primary">Add to Cart</button>
        </section>
      </div>
    </main>
  </body>
</html>
